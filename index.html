<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111018"><meta name="description" content="Your manga library and story studio">
<link rel="manifest" href="manifest.json">
<title>myreadingX</title>
<style>
:root{--bg:#0f0e14;--panel:#191720;--panel2:#23202d;--text:#f8f5ff;--muted:#aaa3b8;--purple:#a879ff;--line:#353041;--pink:#f27dc4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--purple);color:#160d23;font-weight:750}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#47202f;color:#ffd8e6}.app{max-width:980px;margin:auto;padding:0 16px 96px}.top{display:flex;align-items:center;gap:12px;padding:22px 0 16px;position:sticky;top:0;background:#0f0e14ee;backdrop-filter:blur(14px);z-index:5}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#a879ff,#ef79c5);display:grid;place-items:center;font-size:21px;font-weight:950;color:#160d23}.brand{font-weight:900;font-size:23px;letter-spacing:-.8px}.brand span{color:var(--purple)}.sub{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 16px}.tab{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 14px}.tab.active{background:#322448;color:#e4d3ff;border-color:#69489b}.hero{padding:22px;border:1px solid #433456;border-radius:22px;background:radial-gradient(ellipse at top right,#503276 0,transparent 50%),linear-gradient(130deg,#20172e,#17151f);margin-bottom:20px}.eyebrow{color:#c8a8ff;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(26px,6vw,38px);line-height:1.06;margin:10px 0}.hero p{color:#c8c0d2;line-height:1.5;margin:0 0 18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.sectionhead h2{font-size:18px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.cover{height:190px;background:linear-gradient(135deg,#2c2440,#191720);display:grid;place-items:center;overflow:hidden;color:#bda2ff;font-size:40px}.cover img{width:100%;height:100%;object-fit:cover}.cardbody{padding:11px}.cardtitle{font-weight:800;overflow-wrap:anywhere}.tiny{font-size:12px;color:var(--muted);margin-top:4px}.form{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:18px;margin-bottom:14px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-weight:750;font-size:13px}.field input,.field textarea,.field select{width:100%;background:#100f16;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;outline-color:var(--purple)}textarea{resize:vertical;min-height:100px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.45}.hidden{display:none!important}.empty{border:1px dashed #4a4358;border-radius:18px;text-align:center;padding:28px 18px;color:var(--muted)}.page-list{display:grid;gap:10px}.page-item{display:flex;gap:10px;align-items:center;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.thumb{width:55px;height:70px;object-fit:cover;border-radius:7px;background:#292433}.page-meta{flex:1;min-width:0}.page-meta strong{display:block;overflow-wrap:anywhere}.reader{background:#050507;position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}.readerbar{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#14121b}.readercontent{flex:1;overflow:auto;text-align:center}.readercontent img{display:block;width:auto;max-width:100%;height:auto;max-height:none;margin:0 auto 3px}.readercontent img.fit{max-height:calc(100vh - 115px);object-fit:contain}.pill{display:inline-block;background:#342541;color:#e2cbff;padding:4px 8px;border-radius:30px;font-size:11px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#100f16;border-radius:12px;margin-bottom:12px}.switchrow input{width:21px;height:21px;accent-color:var(--purple)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#17151ff2;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6}.bottominner{display:flex;gap:8px;width:min(980px,100%)}.bottom button{flex:1;background:transparent;color:var(--muted);font-size:12px;padding:8px}.bottom button.active{color:#d7bfff;background:#322448}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#eee5ff;color:#20152c;padding:11px 16px;border-radius:12px;z-index:30;max-width:90%;font-weight:700}.storyout{white-space:pre-wrap;line-height:1.65;background:#100f16;border:1px solid var(--line);padding:14px;border-radius:12px}.smallbtn{padding:7px 10px;font-size:12px}.count{font-size:12px;color:var(--muted)}@media(min-width:700px){.app{padding-bottom:35px}.bottom{position:static;border:0;background:transparent}.bottominner{justify-content:flex-start}.bottom button{flex:0 0 auto;border:1px solid var(--line);border-radius:12px}.hero{padding:30px}.cover{height:230px}}
</style></head>
<body>
<div class="app">
<header class="top"><div class="logo">X</div><div><div class="brand">myreading<span>X</span></div><div class="sub">YOUR MANGA · YOUR STORIES</div></div><div style="margin-left:auto"><button id="installBtn" class="secondary hidden">Install</button></div></header>
<nav class="tabs" id="tabs"><button class="tab active" data-view="home">Home</button><button class="tab" data-view="library">My Library</button><button class="tab" data-view="import">Import pages</button><button class="tab" data-view="studio">Manga Studio</button></nav>
<main id="main"></main>
</div>
<div class="bottom"><div class="bottominner"><button data-view="home" class="active">⌂<br>Home</button><button data-view="library">▤<br>Library</button><button data-view="import">＋<br>Import</button><button data-view="studio">✦<br>Studio</button></div></div>
<div id="reader" class="reader hidden"><div class="readerbar"><button class="secondary" id="closeReader">← Back</button><span id="readerTitle">Reading</span><button class="secondary" id="fitBtn">Fit page</button></div><div id="readerContent" class="readercontent"></div></div>
<script>
const DB='myreadingx-db', STORE='items'; let db, currentView='home', deferredPrompt=null, currentReader={pages:[],title:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=()=>res(x);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function blobURL(blob){return URL.createObjectURL(blob)}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function setView(v){currentView=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
async function render(){const items=await all();let main=$('#main');
if(currentView==='home'){let books=items.filter(x=>x.type==='book');main.innerHTML=`<section class="hero"><div class="eyebrow">Your personal manga universe</div><h1>Every page has<br>a story. ✦</h1><p>Bring your downloaded manga together or turn your imagination into an original story.</p><div class="row"><button data-go="import">＋ Import manga</button><button class="secondary" data-go="studio">✦ Create a story</button></div></section><div class="sectionhead"><h2>Continue your collection</h2><span class="count">${books.length} title${books.length===1?'':'s'}</span></div>${books.length?`<div class="grid">${books.slice(0,6).map(bookCard).join('')}</div>`:`<div class="empty"><div style="font-size:35px">▤</div><strong>Your library starts here</strong><p>Import several manga images at once and group them into chapters.</p><button data-go="import">Import pages</button></div>`}<div class="sectionhead"><h2>Made for manga fans</h2></div><div class="grid"><div class="card"><div class="cardbody"><div style="font-size:26px">📚</div><strong>Private library</strong><p class="hint">Your imported pages stay in this browser on this device.</p></div></div><div class="card"><div class="cardbody"><div style="font-size:26px">✍️</div><strong>Story workshop</strong><p class="hint">Draft characters, scenes and dialogue before generating artwork.</p></div></div></div>`}
if(currentView==='library'){let books=items.filter(x=>x.type==='book');main.innerHTML=`<div class="sectionhead"><h2>My Library</h2><button data-go="import">＋ Import</button></div>${books.length?`<div class="grid">${books.map(bookCard).join('')}</div>`:`<div class="empty"><div style="font-size:35px">📚</div><strong>No manga yet</strong><p>Choose your downloaded images to create your first title.</p><button data-go="import">Import manga pages</button></div>`}`}
if(currentView==='import'){main.innerHTML=`<div class="sectionhead"><h2>Import manga pages</h2></div><div class="form"><div class="field"><label>Manga title</label><input id="mTitle" placeholder="e.g. My Favourite Manga"></div><div class="field"><label>Chapter name</label><input id="mChapter" placeholder="e.g. Chapter 01 — The Beginning"></div><div class="field"><label>Select multiple images</label><input id="mFiles" type="file" accept="image/*" multiple></div><p class="hint">Tip: Select pages in reading order. You can reorder them after import. Large collections use device storage, so import a chapter at a time for best results.</p><button id="importBtn" style="width:100%">Import selected pages</button></div><div id="importPreview" class="hint"></div><div class="sectionhead"><h2>How it works</h2></div><div class="form"><p>① Download manga page images to your phone.</p><p>② Select all the pages for one chapter.</p><p>③ Import, reorder pages and start reading.</p></div>`;$('#importBtn').onclick=importPages}
if(currentView==='studio'){main.innerHTML=`<div class="sectionhead"><h2>✦ Manga Studio</h2><span class="pill">STORY FIRST</span></div><div class="form"><div class="field"><label>Manga title</label><input id="sTitle" placeholder="e.g. Moonlit Promise"></div><div class="field"><label>Story idea / prompt</label><textarea id="sPrompt" placeholder="A shy student discovers a mysterious library where every book predicts the future..."></textarea></div><div class="row"><div class="field"><label>Genre</label><select id="sGenre"><option>Fantasy</option><option>Romance</option><option>Action</option><option>Comedy</option><option>Horror</option><option>Slice of life</option><option>Mystery</option><option>Science fiction</option></select></div><div class="field"><label>Art direction</label><select id="sStyle"><option>Black-and-white manga</option><option>Anime color</option><option>Soft watercolor</option><option>Dark fantasy</option><option>Retro manga</option></select></div></div><div class="switchrow"><div><strong>SFW mode</strong><div class="hint">General-audience content</div></div><input type="radio" name="rating" value="sfw" checked aria-label="SFW"></div><div class="switchrow"><div><strong>Mature mode (18+)</strong><div class="hint">Mature themes; explicit generation depends on service rules</div></div><input type="radio" name="rating" value="mature" aria-label="Mature 18+"></div><button id="draftBtn" style="width:100%">✦ Draft my story</button><p class="hint" style="margin-top:10px">MVP note: this creates a local story outline without an AI service. Real AI writing and artwork generation require connecting an API.</p></div><div id="storyResult"></div>`;$('#draftBtn').onclick=draftStory}
main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openBook(b.dataset.open));main.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this manga and its imported pages from this app?')){let id=b.dataset.delete;let allItems=await all();for(let x of allItems)if(x.bookId===id||x.id===id)await del(x.id);render();toast('Manga deleted from this device')}})
}
function bookCard(b){return `<div class="card"><div class="cover">${b.cover?`<img src="${blobURL(b.cover)}" alt="">`:'📖'}</div><div class="cardbody"><div class="cardtitle">${esc(b.title)}</div><div class="tiny">${esc(b.chapter||'Chapter 1')} · ${b.pageCount||0} pages</div><div class="row" style="margin-top:10px"><button class="smallbtn" data-open="${b.id}">Read</button><button class="smallbtn secondary" data-delete="${b.id}">Delete</button></div></div></div>`}
async function importPages(){let title=$('#mTitle').value.trim(),chapter=$('#mChapter').value.trim()||'Chapter 1',files=[...($('#mFiles').files||[])];if(!title){toast('Enter a manga title first');return}if(!files.length){toast('Choose one or more image files');return}let images=files.filter(f=>f.type.startsWith('image/'));if(!images.length){toast('No supported image files selected');return}let existing=(await all()).find(x=>x.type==='book'&&x.title.toLowerCase()===title.toLowerCase());let book=existing||{id:uid(),type:'book',title,chapter,pageCount:0,created:Date.now()};let pageItems=[];for(let i=0;i<images.length;i++){pageItems.push({id:uid(),type:'page',bookId:book.id,chapter,order:book.pageCount+i+1,name:images[i].name,blob:images[i]})}book.pageCount+=pageItems.length;book.chapter=chapter;if(!book.cover)book.cover=images[0];try{await put(book);for(let p of pageItems)await put(p);toast(`Imported ${pageItems.length} pages!`);setView('library')}catch(e){toast('Storage limit reached. Try importing fewer pages.')}} 
async function openBook(id){let items=await all(),book=items.find(x=>x.id===id),pages=items.filter(x=>x.type==='page'&&x.bookId===id).sort((a,b)=>a.order-b.order);if(!book||!pages.length){toast('No pages found');return}currentReader={pages,title:book.title};$('#readerTitle').textContent=book.title;$('#readerContent').innerHTML=pages.map((p,i)=>`<img class="fit" src="${blobURL(p.blob)}" alt="Page ${i+1}" loading="${i<3?'eager':'lazy'}">`).join('');$('#reader').classList.remove('hidden')}
async function draftStory(){let title=$('#sTitle').value.trim()||'Untitled Manga',prompt=$('#sPrompt').value.trim();if(!prompt){toast('Describe your story idea first');return}let genre=$('#sGenre').value,style=$('#sStyle').value,rating=document.querySelector('input[name="rating"]:checked').value;let lines=`${title}\nGenre: ${genre}\nArt direction: ${style}\nContent setting: ${rating==='sfw'?'SFW / General audience':'Mature themes / 18+'}\n\nSTORY PREMISE\n${prompt}\n\nCHAPTER 1 — THE BEGINNING\nOpening panel: Establish the main character and the world through a striking visual scene.\n\nScene 1 — The ordinary world\nNarration: Every great story begins before its hero knows their life is about to change.\nCharacter dialogue: “I thought today would be just like any other day...”\n\nScene 2 — The turning point\nShow an unexpected event connected to the story idea: a discovery, a meeting, a challenge, or a mysterious message.\nCharacter dialogue: “Wait... what is that?”\n\nScene 3 — The choice\nThe main character must decide whether to investigate or walk away. End the chapter on a question or surprising reveal.\n\nNEXT STEP\nDevelop character names, appearances, panel-by-panel descriptions and dialogue. This is a starter template, not AI-generated prose; connect a text-generation service for a fully written story.`;$('#storyResult').innerHTML=`<div class="sectionhead"><h2>Your story draft</h2></div><div class="storyout" id="storyText">${esc(lines)}</div><div class="row" style="margin-top:10px"><button id="copyStory">Copy draft</button><button class="secondary" id="saveStory">Save to library</button></div>`;$('#copyStory').onclick=async()=>{try{await navigator.clipboard.writeText(lines);toast('Draft copied')}catch(e){toast('Select and copy the draft text')}};$('#saveStory').onclick=async()=>{await put({id:uid(),type:'story',title,content:lines,created:Date.now()});toast('Story draft saved locally')}}
$('#closeReader').onclick=()=>$('#reader').classList.add('hidden');$('#fitBtn').onclick=()=>document.querySelectorAll('#readerContent img').forEach(i=>i.classList.toggle('fit'));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').classList.add('hidden')}else toast('Use Chrome menu → Install app when this app is hosted securely')};
(async()=>{try{await openDB();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render()}catch(e){$('#main').innerHTML='<div class="empty">Could not open local storage in this browser. Try Chrome on Android.</div>'}})();
</script></body></html>
